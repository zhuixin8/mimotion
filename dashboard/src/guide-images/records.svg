<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc"><title id="title">09  看懂记录中的四种关键状态</title><desc id="desc">本站状态说明图 · 第三方平台的最终显示，以对应 App 为准</desc><g font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif"><rect x="0" y="0" width="1000" height="570" rx="20" fill="#f4f7fc" stroke="#f4f7fc"/><text x="35" y="47" font-size="27" fill="#21344e" font-weight="700">09  看懂记录中的四种关键状态</text><text x="35" y="79" font-size="16" fill="#65768e" font-weight="400">本站状态说明图 · 第三方平台的最终显示，以对应 App 为准</text><rect x="35" y="119" width="930" height="88" rx="14" fill="#fff" stroke="#dce4f0"/><rect x="59" y="141" width="176" height="42" rx="9" fill="#2854de" stroke="#2854de"/><text x="74" y="169" font-size="18" fill="#fff" font-weight="600">接口已接收</text><text x="259" y="157" font-size="22" fill="#21344e" font-weight="600">Zepp 接口返回接收成功</text><text x="259" y="185" font-size="18" fill="#63758e" font-weight="400">还要看云端读数；不代表微信或支付宝已更新。</text><rect x="35" y="223" width="930" height="88" rx="14" fill="#fff" stroke="#dce4f0"/><rect x="59" y="245" width="176" height="42" rx="9" fill="#a77629" stroke="#a77629"/><text x="74" y="273" font-size="18" fill="#fff" font-weight="600">等待自动核对</text><text x="259" y="260" font-size="22" fill="#21344e" font-weight="600">稍后自动查询，不重新提交</text><text x="259" y="289" font-size="18" fill="#63758e" font-weight="400">约 30 秒和 2 分钟后核对，队列繁忙时可能延后。</text><rect x="35" y="327" width="930" height="88" rx="14" fill="#fff" stroke="#dce4f0"/><rect x="59" y="349" width="176" height="42" rx="9" fill="#24845e" stroke="#24845e"/><text x="74" y="377" font-size="18" fill="#fff" font-weight="600">云端达到目标</text><text x="259" y="364" font-size="22" fill="#21344e" font-weight="600">当天汇总与明细一致且达到目标</text><text x="259" y="393" font-size="18" fill="#63758e" font-weight="400">再打开目标第三方 App，核对当天步数。</text><rect x="35" y="431" width="930" height="88" rx="14" fill="#fff" stroke="#dce4f0"/><rect x="59" y="453" width="176" height="42" rx="9" fill="#a77629" stroke="#a77629"/><text x="74" y="481" font-size="18" fill="#fff" font-weight="600">提交结果待确认</text><text x="259" y="468" font-size="22" fill="#21344e" font-weight="600">使用“重新核对（不重新提交）”</text><text x="259" y="497" font-size="18" fill="#63758e" font-weight="400">不要把“结果待确认”当作“没有提交过”。</text></g></svg>