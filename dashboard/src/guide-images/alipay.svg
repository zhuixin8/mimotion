<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc"><title id="title">04  支付宝按实际可用入口操作</title><desc id="desc">条件流程示意 · 本站不能替你开通第三方入口或保证第三方同步</desc><g font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif"><rect x="0" y="0" width="1000" height="570" rx="20" fill="#f4f7fc" stroke="#f4f7fc"/><text x="35" y="47" font-size="27" fill="#21344e" font-weight="700">04  支付宝按实际可用入口操作</text><text x="35" y="79" font-size="16" fill="#65768e" font-weight="400">条件流程示意 · 本站不能替你开通第三方入口或保证第三方同步</text><rect x="35" y="112" width="270" height="392" rx="24" fill="#fff" stroke="#cbd6e6"/><rect x="129" y="124" width="82" height="7" rx="4" fill="#dce4f0" stroke="#dce4f0"/><text x="57" y="169" font-size="22" fill="#21344e" font-weight="700">第三方平台列表</text><path d="M53 190h234" stroke="#e9eef5"/><text x="57" y="229" font-size="19" fill="#21344e" font-weight="400">微信</text><text x="57" y="261" font-size="19" fill="#21344e" font-weight="400">其他可用平台</text><rect x="51" y="315" width="238" height="56" rx="14" fill="#edf3ff" stroke="#8ca8f5"/><text x="68" y="350" font-size="21" fill="#2450cf" font-weight="600">支付宝（如有）</text><circle cx="278" cy="341" r="16" fill="#2854de"/><text x="273" y="347" font-size="17" fill="#fff" font-weight="700">1</text><text x="57" y="420" font-size="16" fill="#21344e" font-weight="400">没有入口时，先查 App</text><text x="57" y="446" font-size="16" fill="#21344e" font-weight="400">版本与账号地区支持情况</text><rect x="134" y="486" width="72" height="4" rx="2" fill="#cbd6e6" stroke="#cbd6e6"/><text x="318" y="313" font-size="32" fill="#8b9cba" font-weight="600">→</text><rect x="365" y="112" width="270" height="392" rx="24" fill="#fff" stroke="#cbd6e6"/><rect x="459" y="124" width="82" height="7" rx="4" fill="#dce4f0" stroke="#dce4f0"/><text x="387" y="169" font-size="22" fill="#21344e" font-weight="700">在支付宝授权</text><path d="M383 190h234" stroke="#e9eef5"/><text x="387" y="230" font-size="19" fill="#21344e" font-weight="400">确认是自己的支付宝账号</text><text x="387" y="262" font-size="19" fill="#21344e" font-weight="400">查看授权内容</text><text x="387" y="294" font-size="19" fill="#21344e" font-weight="400">按页面提示完成授权</text><rect x="387" y="351" width="226" height="42" rx="9" fill="#1677cc" stroke="#1677cc"/><text x="402" y="379" font-size="18" fill="#fff" font-weight="600">同意授权（示意）</text><text x="387" y="435" font-size="16" fill="#21344e" font-weight="400">如出现扫码，使用支付宝</text><rect x="464" y="486" width="72" height="4" rx="2" fill="#cbd6e6" stroke="#cbd6e6"/><text x="648" y="313" font-size="32" fill="#8b9cba" font-weight="600">→</text><rect x="695" y="112" width="270" height="392" rx="24" fill="#fff" stroke="#cbd6e6"/><rect x="789" y="124" width="82" height="7" rx="4" fill="#dce4f0" stroke="#dce4f0"/><text x="717" y="169" font-size="22" fill="#21344e" font-weight="700">确认绑定和结果</text><path d="M713 190h234" stroke="#e9eef5"/><rect x="717" y="219" width="226" height="46" rx="14" fill="#e9f7f1" stroke="#bde3d0"/><text x="732" y="249" font-size="18" fill="#197452" font-weight="600">返回 App 确认已绑定</text><text x="717" y="321" font-size="18" fill="#21344e" font-weight="400">在支付宝搜索“运动”</text><text x="717" y="356" font-size="18" fill="#21344e" font-weight="400">打开对应运动页面</text><text x="717" y="391" font-size="18" fill="#21344e" font-weight="400">稍后核对当天步数</text><text x="717" y="448" font-size="17" fill="#9a6226" font-weight="400">运动授权 ≠ 支付付款码</text><rect x="794" y="486" width="72" height="4" rx="2" fill="#cbd6e6" stroke="#cbd6e6"/></g></svg>