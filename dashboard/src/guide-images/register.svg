<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc"><title id="title">02  准备可用的账号和密码</title><desc id="desc">操作示意图 · 界面名称与位置请以手机 App 实际显示为准</desc><g font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif"><rect x="0" y="0" width="1000" height="570" rx="20" fill="#f4f7fc" stroke="#f4f7fc"/><text x="35" y="47" font-size="27" fill="#21344e" font-weight="700">02  准备可用的账号和密码</text><text x="35" y="79" font-size="16" fill="#65768e" font-weight="400">操作示意图 · 界面名称与位置请以手机 App 实际显示为准</text><rect x="35" y="112" width="270" height="392" rx="24" fill="#fff" stroke="#cbd6e6"/><rect x="129" y="124" width="82" height="7" rx="4" fill="#dce4f0" stroke="#dce4f0"/><text x="57" y="169" font-size="22" fill="#21344e" font-weight="700">选择注册方式</text><path d="M53 190h234" stroke="#e9eef5"/><text x="57" y="227" font-size="19" fill="#21344e" font-weight="400">邮箱 / 手机号</text><text x="57" y="259" font-size="19" fill="#21344e" font-weight="400">按实际提供的方式选择</text><text x="57" y="291" font-size="19" fill="#21344e" font-weight="400">使用你能接收验证码的账号</text><rect x="57" y="338" width="226" height="48" rx="14" fill="#f6f9ff" stroke="#dce4f0"/><text x="69" y="369" font-size="18" fill="#21344e" font-weight="400">选择实际使用地区</text><rect x="57" y="412" width="226" height="42" rx="9" fill="#2854de" stroke="#2854de"/><text x="72" y="440" font-size="18" fill="#fff" font-weight="600">注册账号</text><rect x="134" y="486" width="72" height="4" rx="2" fill="#cbd6e6" stroke="#cbd6e6"/><text x="318" y="313" font-size="32" fill="#8b9cba" font-weight="600">→</text><rect x="365" y="112" width="270" height="392" rx="24" fill="#fff" stroke="#cbd6e6"/><rect x="459" y="124" width="82" height="7" rx="4" fill="#dce4f0" stroke="#dce4f0"/><text x="387" y="169" font-size="22" fill="#21344e" font-weight="700">验证并设置密码</text><path d="M383 190h234" stroke="#e9eef5"/><text x="387" y="230" font-size="19" fill="#21344e" font-weight="400">填写邮箱或手机号</text><text x="387" y="262" font-size="19" fill="#21344e" font-weight="400">接收并填写验证码</text><text x="387" y="294" font-size="19" fill="#21344e" font-weight="400">按提示设置登录密码</text><rect x="387" y="338" width="226" height="48" rx="14" fill="#f6f9ff" stroke="#dce4f0"/><text x="399" y="369" font-size="22" fill="#21344e" font-weight="400">••••••••••</text><rect x="387" y="412" width="226" height="42" rx="9" fill="#2854de" stroke="#2854de"/><text x="402" y="440" font-size="18" fill="#fff" font-weight="600">完成注册</text><rect x="464" y="486" width="72" height="4" rx="2" fill="#cbd6e6" stroke="#cbd6e6"/><text x="648" y="313" font-size="32" fill="#8b9cba" font-weight="600">→</text><rect x="695" y="112" width="270" height="392" rx="24" fill="#fff" stroke="#cbd6e6"/><rect x="789" y="124" width="82" height="7" rx="4" fill="#dce4f0" stroke="#dce4f0"/><text x="717" y="169" font-size="22" fill="#21344e" font-weight="700">先在官方 App 登录</text><path d="M713 190h234" stroke="#e9eef5"/><text x="717" y="231" font-size="19" fill="#21344e" font-weight="400">使用同一账号和密码</text><text x="717" y="263" font-size="19" fill="#21344e" font-weight="400">完成 App 要求的资料</text><text x="717" y="295" font-size="19" fill="#21344e" font-weight="400">确认能进入 App 首页</text><rect x="717" y="343" width="226" height="43" rx="14" fill="#e9f7f1" stroke="#d1eadf"/><text x="731" y="371" font-size="19" fill="#197452" font-weight="600">已进入 Zepp Life</text><text x="717" y="434" font-size="17" fill="#21344e" font-weight="400">再继续绑定第三方平台</text><rect x="794" y="486" width="72" height="4" rx="2" fill="#cbd6e6" stroke="#cbd6e6"/></g></svg>