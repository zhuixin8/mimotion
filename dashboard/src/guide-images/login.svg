<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc"><title id="title">05  使用 Zepp Life 账号登录本站</title><desc id="desc">本站操作示意 · 示例邮箱不代表真实账号；请勿填写短信验证码或小米账号密码</desc><g font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif"><rect x="0" y="0" width="1000" height="570" rx="20" fill="#f4f7fc" stroke="#f4f7fc"/><text x="35" y="47" font-size="27" fill="#21344e" font-weight="700">05  使用 Zepp Life 账号登录本站</text><text x="35" y="79" font-size="16" fill="#65768e" font-weight="400">本站操作示意 · 示例邮箱不代表真实账号；请勿填写短信验证码或小米账号密码</text><rect x="35" y="113" width="930" height="392" rx="14" fill="#fff" stroke="#dce4f0"/><rect x="35" y="113" width="930" height="47" rx="14" fill="#eef3fa" stroke="#dce4f0"/><text x="58" y="143" font-size="19" fill="#21344e" font-weight="600">MiMotion  /  登录</text><text x="72" y="224" font-size="34" fill="#21344e" font-weight="400">你的每日计划，</text><text x="72" y="270" font-size="34" fill="#21344e" font-weight="400">在这里管理。</text><text x="72" y="345" font-size="20" fill="#56708f" font-weight="400">同一 Zepp Life 账号</text><text x="72" y="383" font-size="20" fill="#56708f" font-weight="400">不需要 GitHub 授权</text><rect x="496" y="182" width="430" height="293" rx="14" fill="#fff" stroke="#dce4f0"/><text x="521" y="217" font-size="23" fill="#21344e" font-weight="700">登录你的账号</text><rect x="521" y="237" width="380" height="44" rx="14" fill="#f9fbff" stroke="#dce4f0"/><text x="537" y="265" font-size="19" fill="#21344e" font-weight="400">your-account@example.com</text><circle cx="901" cy="259" r="16" fill="#2854de"/><text x="896" y="265" font-size="17" fill="#fff" font-weight="700">1</text><rect x="521" y="297" width="380" height="44" rx="14" fill="#f9fbff" stroke="#dce4f0"/><text x="537" y="325" font-size="19" fill="#21344e" font-weight="400">Zepp Life 密码：••••••••</text><circle cx="901" cy="319" r="16" fill="#2854de"/><text x="896" y="325" font-size="17" fill="#fff" font-weight="700">2</text><text x