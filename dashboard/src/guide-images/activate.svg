<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc"><title id="title">06  兑换激活码，确认使用期</title><desc id="desc">本站操作示意 · 不展示任何真实激活码；已有账号也在这里续期</desc><g font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif"><rect x="0" y="0" width="1000" height="570" rx="20" fill="#f4f7fc" stroke="#f4f7fc"/><text x="35" y="47" font-size="27" fill="#21344e" font-weight="700">06  兑换激活码，确认使用期</text><text x="35" y="79" font-size="16" fill="#65768e" font-weight="400">本站操作示意 · 不展示任何真实激活码；已有账号也在这里续期</text><rect x="35" y="113" width="930" height="392" rx="14" fill="#fff" stroke="#dce4f0"/><rect x="35" y="113" width="930" height="47" rx="14" fill="#eef3fa" stroke="#dce4f0"/><text x="58" y="143" font-size="19" fill="#21344e" font-weight="600">轻步云  /  激活与续期</text><rect x="53" y="179" width="187" height="306" rx="14" fill="#f7f9fd" stroke="#dce4f0"/><text x="70" y="216" font-size="19" fill="#21344e" font-weight="400">运行概览</text><text x="70" y="248" font-size="19" fill="#21344e" font-weight="400">步数计划</text><text x="70" y="280" font-size="19" fill="#21344e" font-weight="400">执行记录</text><rect x="63" y="315" width="167" height="43" rx="14" fill="#e8efff" stroke="#e8efff"/><text x="78" y="343" font-size="21" fill="#2854de" font-weight="600">激活与续期</text><circle cx="224" cy="336" r="16" fill="#2854de"/><text x="219" y="342" font-size="17" fill="#fff" font-weight="700">1</text><text x="272" y="214" font-size="26" fill="#21344e" font-weight="700">激活你的使用期</text><text x="272" y="249" font-size="20" fill="#61738a" font-weight="400">从服务提供方获取激活码，粘贴后兑换。</text><rect x="272" y="274" width="646" height="49" rx="14" fill="#f8faff" stroke="#dce4f0"/><text x="290" y="306" font-size="21" fill="#21344e" font-weight="400">粘贴你的激活码（示例，不能兑换）</text><circle cx="901" cy="298" r="16" fill="#2854de"/><text x="896" y="304" font-size="17" fill="#fff" font-weight="700">2</text><rect x="272" y="345" width="192" height="42" rx="9" fill="#2854de" stroke="#2854de"/><text x="287" y="373" font-size="18" fill="#fff" font-weight="600">兑换激活码</text><circle cx="458" cy="366" r="16" fill="#2854de"/><text x="453" y="372" font-size="17" fill="#fff" font-weight="700">3</text><rect x="272" y="413" width="646" height="47" rx="14" fill="#e9f7f1" stroke="#cde8dd"/><text x="288" y="444" font-size="21" fill="#197452" font-weight="600">确认：使用期有效，并显示新的到期时间</text></g></svg>