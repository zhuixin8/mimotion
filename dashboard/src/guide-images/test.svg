<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc"><title id="title">08  分清“测试连接”和“执行一次”</title><desc id="desc">本站操作示意 · 两个按钮的作用不同；均需有效使用期</desc><g font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif"><rect x="0" y="0" width="1000" height="570" rx="20" fill="#f4f7fc" stroke="#f4f7fc"/><text x="35" y="47" font-size="27" fill="#21344e" font-weight="700">08  分清“测试连接”和“执行一次”</text><text x="35" y="79" font-size="16" fill="#65768e" font-weight="400">本站操作示意 · 两个按钮的作用不同；均需有效使用期</text><rect x="35" y="113" width="930" height="392" rx="14" fill="#fff" stroke="#dce4f0"/><rect x="35" y="113" width="930" height="47" rx="14" fill="#eef3fa" stroke="#dce4f0"/><text x="58" y="143" font-size="19" fill="#21344e" font-weight="600">轻步云  /  运行概览</text><rect x="61" y="185" width="421" height="272" rx="14" fill="#fff" stroke="#dce4f0"/><rect x="510" y="185" width="427" height="272" rx="14" fill="#fff" stroke="#dce4f0"/><text x="84" y="223" font-size="25" fill="#21344e" font-weight="700">① 先测试连接</text><text x="84" y="269" font-size="20" fill="#21344e" font-weight="400">检查账号凭据是否可用</text><text x="84" y="303" font-size="20" fill="#21344e" font-weight="400">尝试读取当天云端步数</text><text x="84" y="337" font-size="20" fill="#21344e" font-weight="400">本次不会修改步数</text><rect x="84" y="386" width="372" height="42" rx="9" fill="#2854de" stroke="#2854de"/><text x="99" y="414" font-size="18" fill="#fff" font-weight="600">测试连接</text><text x="533" y="223" font-size="25" fill="#21344e" font-weight="700">② 再执行一次</text><text x="533" y="269" font-size="20" fill="#21344e" font-weight="400">使用已保存的步数计划</text><text x="533" y="303" font-size="20" fill="#21344e" font-weight="400">会向 Zepp 提交步数</text><text x="533" y="337" font-size="20" fill="#21344e" font-weight="400">随后查询云端核对结果</text><rect x="533" y="386" width="381" height="42" rx="9" fill="#2854de" stroke="#2854de"/><text x="548" y="414" font-size="18" fill="#fff" font-weight="600">执行一次并核对</text><text x="65" y="540" font-size="20" fill="#52647d" font-weight="400">先在“步数计划”保存范围；只想检查账号时，选择左侧的“测试连接”。</text></g></svg>