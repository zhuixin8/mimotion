<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc"><title id="title">03  绑定你自己的微信账号</title><desc id="desc">常见流程示意 · 仅在 App 提供微信入口时适用；不要扫描他人的绑定码</desc><g font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif"><rect x="0" y="0" width="1000" height="570" rx="20" fill="#f4f7fc" stroke="#f4f7fc"/><text x="35" y="47" font-size="27" fill="#21344e" font-weight="700">03  绑定你自己的微信账号</text><text x="35" y="79" font-size="16" fill="#65768e" font-weight="400">常见流程示意 · 仅在 App 提供微信入口时适用；不要扫描他人的绑定码</text><rect x="35" y="112" width="270" height="392" rx="24" fill="#fff" stroke="#cbd6e6"/><rect x="129" y="124" width="82" height="7" rx="4" fill="#dce4f0" stroke="#dce4f0"/><text x="57" y="169" font-size="22" fill="#21344e" font-weight="700">Zepp Life · 我的</text><path d="M53 190h234" stroke="#e9eef5"/><text x="57" y="230" font-size="19" fill="#21344e" font-weight="400">我的设备</text><text x="57" y="262" font-size="19" fill="#21344e" font-weight="400">运动目标</text><text x="57" y="294" font-size="19" fill="#21344e" font-weight="400">设置</text><rect x="51" y="338" width="238" height="51" rx="14" fill="#edf3ff" stroke="#8ca8f5"/><text x="63" y="371" font-size="17" fill="#2450cf" font-weight="600">第三方接入</text><circle cx="278" cy="359" r="16" fill="#2854de"/><text x="273" y="365" font-size="17" fill="#fff" font-weight="700">1</text><text x="57" y="437" font-size="17" fill="#6a7a92" font-weight="400">名称和位置可能不同</text><rect x="134" y="486" width="72" height="4" rx="2" fill="#cbd6e6" stroke="#cbd6e6"/><text x="318" y="313" font-size="32" fill="#8b9cba" font-weight="600">→</text><rect x="365" y="112" width="270" height="392" rx="24" fill="#fff" stroke="#cbd6e6"/><rect x="459" y="124" width="82" height="7" rx="4" fill="#dce4f0" stroke="#dce4f0"/><text x="387" y="169" font-size="22" fill="#21344e" font-weight="700">选择微信</text><path d="M383 190h234" stroke="#e9eef5"/><rect x="387" y="214" width="226" height="55" rx="14" fill="#e9f7f1" stroke="#bde3d0"/><text x="402" y="249" font-size="20" fill="#197452" font-weight="600">微信 / 微信运动</text><rect x="411" y="291" width="176" height="121" rx="14" fill="#f4f7fb" stroke="#dce4f0"/><text x="428" y="326" font-size="17" fill="#21344e" font-weight="400">你的专属绑定码</text><text x="428" y="353" font-size="17" fill="#21344e" font-weight="400">或授权按钮</text><text x="428" y="380" font-size="17" fill="#21344e" font-weight="400">示意，不可扫码</text><text x="387" y="447" font-size="17" fill="#21344e" font-weight="400">按页面提示进入微信</text><rect x="464" y="486" width="72" height="4" rx="2" fill="#cbd6e6" stroke="#cbd6e6"/><text x="648" y="313" font-size="32" fill="#8b9cba" font-weight="600">→</text><rect x="695" y="112" width="270" height="392" rx="24" fill="#fff" stroke="#cbd6e6"/><rect x="789" y="124" width="82" height="7" rx="4" fill="#dce4f0" stroke="#dce4f0"/><text x="717" y="169" font-size="22" fill="#21344e" font-weight="700">在微信确认</text><path d="M713 190h234" stroke="#e9eef5"/><text x="717" y="228" font-size="19" fill="#21344e" font-weight="400">确认当前微信是目标账号</text><text x="717" y="260" font-size="19" fill="#21344e" font-weight="400">按提示允许或完成绑定</text><text x="717" y="292" font-size="19" fill="#21344e" font-weight="400">返回 Zepp Life 检查状态</text><rect x="717" y="344" width="226" height="42" rx="9" fill="#24845e" stroke="#24845e"/><text x="732" y="372" font-size="18" fill="#fff" font-weight="600">按官方页面确认</text><rect x="717" y="410" width="226" height="42" rx="14" fill="#e9f7f1" stroke="#bde3d0"/><text x="733" y="438" font-size="18" fill="#197452" font-weight="600">确认显示已绑定</text><rect x="794" y="486" width="72" height="4" rx="2" fill="#cbd6e6" stroke="#cbd6e6"/></g></svg>